name: Sincronizar Promiedos

on:
  schedule:
    # Se ejecuta cada 5 minutos (es el mínimo que permite GitHub Actions de forma confiable)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde la pestaña "Actions" de GitHub

jobs:
  sync:
  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script de sincronización
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node sync-promiedos.js